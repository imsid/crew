kind: source
version: 1
id: play_candidates
dataset: crm_db
table: play_candidates
subject:
  - org_id
ts: created_at
dimensions:
  - name: run_id
    expr: run_id
    data_type: STRING
    is_primary_key: true
  - name: org_id
    expr: org_id
    data_type: STRING
    is_primary_key: true
  - name: workflow_id
    expr: workflow_id
    data_type: STRING
  - name: org_name
    expr: org_name
    data_type: STRING
  - name: play_id
    expr: play_id
    data_type: STRING
  - name: created_at
    expr: created_at
    data_type: TIMESTAMP
  # Snapshot fields are JSON, so anything a metric needs is declared here as a
  # computed dimension — the compiler has no JSON accessor of its own.
  - name: plan_tier
    expr: JSON_VALUE(org_snapshot, '$.plan_tier')
    data_type: STRING
  - name: as_of_date
    expr: DATE(JSON_VALUE(usage_snapshot, '$.as_of_date'))
    data_type: DATE
  - name: assignment_status
    expr: IF(play_id IS NULL, 'unassigned', 'assigned')
    data_type: STRING
measures:
  - name: candidate_count
    expr: "1"
    agg: COUNT
    data_type: INT64
  - name: dollars_at_risk_sum
    expr: CAST(JSON_VALUE(usage_snapshot, '$.dollars_at_risk') AS FLOAT64)
    agg: SUM
    data_type: FLOAT64
  - name: assigned_count
    expr: CASE WHEN play_id IS NULL THEN 0 ELSE 1 END
    agg: SUM
    data_type: INT64
