kind: source
version: 1
id: accounts
dataset: crm_db
table: accounts
subject:
  - org_id
dimensions:
  - name: org_id
    expr: org_id
    data_type: STRING
    is_primary_key: true
  - name: account_name
    expr: account_name
    data_type: STRING
  - name: domain
    expr: domain
    data_type: STRING
  - name: owner
    expr: owner
    data_type: STRING
  - name: segment
    expr: segment
    data_type: STRING
  - name: lifecycle_stage
    expr: lifecycle_stage
    data_type: STRING
  - name: plan_tier
    expr: plan_tier
    data_type: STRING
  - name: consumption_mrr
    expr: consumption_mrr
    data_type: FLOAT64
  - name: active_users
    expr: active_users
    data_type: INT64
  - name: thesis
    expr: thesis
    data_type: STRING
measures:
  - name: account_count
    expr: "1"
    agg: COUNT
    data_type: INT64
  - name: consumption_mrr_sum
    expr: consumption_mrr
    agg: SUM
    data_type: FLOAT64
  - name: active_users_sum
    expr: active_users
    agg: SUM
    data_type: INT64
joins:
  - to_source: company_enrichment
    join_type: INNER
    left_key: domain
    right_key: domain
    relationship: many_to_one
