kind: source
version: 1
id: plays
dataset: crm_db
table: plays
subject:
  - org_id
dimensions:
  - name: play_id
    expr: play_id
    data_type: STRING
    is_primary_key: true
  - name: org_id
    expr: org_id
    data_type: STRING
  - name: workflow_id
    expr: workflow_id
    data_type: STRING
  - name: play_type
    expr: play_type
    data_type: STRING
  - name: segment
    expr: segment
    data_type: STRING
  - name: status
    expr: status
    data_type: STRING
  - name: holdout_arm
    expr: holdout_arm
    data_type: STRING
measures:
  - name: play_count
    expr: "1"
    agg: COUNT
    data_type: INT64
  - name: dollars_at_risk_sum
    expr: dollars_at_risk
    agg: SUM
    data_type: FLOAT64
  - name: treatment_count
    expr: CASE WHEN holdout_arm = 'treatment' THEN 1 ELSE 0 END
    agg: SUM
    data_type: INT64
  - name: holdout_count
    expr: CASE WHEN holdout_arm = 'control' THEN 1 ELSE 0 END
    agg: SUM
    data_type: INT64
joins:
  - to_source: accounts
    join_type: INNER
    left_key: org_id
    right_key: org_id
    relationship: many_to_one
